site_name: dekimpew docs
theme: 
  name: material
  palette:
    - scheme: default
      primary: cyan
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      primary: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en

markdown_extensions:
  - def_list
  - sane_lists
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
- Home: index.md
- Homelab: 
  - Setup: homelab/index.md
  - Topology: homelab/topology.md
- VCF: 
  - External OIDC on Supervisor: vcf/wcp_oidc.md
  - RBAC options on Supervisor: vcf/rbac_on_wcp.md
  - Issues with Supervisor: vcf/wcp_issues.md
#- AVI:
#  - Running AVI DNS in VCF9.1: avi/dns.md
- Kubernetes: 
  - Introduction: k8s/index.md
  - Custom HPA metrics: k8s/custom_hpa.md